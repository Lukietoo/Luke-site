<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Checked by og-image.mjs before it shoots: the card set in a fallback
         mono is the bug that made the first one need replacing. -->
    <meta name="og-font-check" content="500 104px 'JetBrains Mono'" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #04070d;
      }
      #field {
        position: absolute;
        inset: 0;
      }
      .stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .title {
        display: flex;
        align-items: baseline;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 104px;
        line-height: 1.1;
        color: #fff;
        letter-spacing: -0.02em;
        text-shadow:
          0 0 3px rgba(255, 255, 255, 0.7),
          0 0 30px rgba(140, 190, 255, 0.35);
      }
      .cursor {
        display: inline-block;
        width: 0.56em;
        height: 0.74em;
        margin-left: 0.08em;
        background: #fff;
      }
      .role {
        margin-top: 34px;
        font: 500 19px 'JetBrains Mono', monospace;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.9);
      }
      /* Same hairline the site uses to separate the name from what's under it. */
      .rule {
        margin-top: 40px;
        width: 132px;
        height: 1px;
        background: rgba(122, 168, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <canvas id="field" width="1200" height="630"></canvas>
    <div class="stack">
      <h1 class="title"><span>Luke To</span><span class="cursor"></span></h1>
      <div class="rule"></div>
      <p class="role">Student @ UC Berkeley &amp; Founder</p>
    </div>

    <script>
      // A still frame of the landing page's ASCII field: a mono glyph grid that
      // falls quiet toward the middle so the name stays legible on top of it.
      const c = document.getElementById('field');
      const x = c.getContext('2d');
      const GLYPHS = '.:-=+*#%@';
      const CELL = 15;
      const cx = 1200 / 2;
      const cy = 630 / 2;
      const maxD = Math.hypot(cx, cy);

      x.font = "500 13px 'JetBrains Mono', monospace";
      x.textBaseline = 'middle';
      x.textAlign = 'center';

      for (let gy = CELL / 2; gy < 630; gy += CELL) {
        for (let gx = CELL / 2; gx < 1200; gx += CELL) {
          const nx = (gx - cx) / maxD;
          const ny = (gy - cy) / maxD;
          const d = Math.hypot(nx, ny);

          // Two interfering waves stand in for the field's motion, sampled at one
          // instant. Everything inside calmRadius is dropped.
          const w =
            Math.sin(gx * 0.021 + gy * 0.013) * 0.5 +
            Math.sin(gx * 0.009 - gy * 0.024 + 1.7) * 0.5;
          const falloff = Math.max(0, (d - 0.18) / (1 - 0.18));
          const amp = ((w + 1) / 2) * falloff;
          if (amp < 0.16) continue;

          const g = GLYPHS[Math.min(GLYPHS.length - 1, Math.floor(amp * 9))];
          const tint = amp > 0.62 ? '122, 168, 255' : '210, 226, 255';
          x.fillStyle = `rgba(${tint}, ${(amp * 0.34).toFixed(3)})`;
          x.fillText(g, gx, gy);
        }
      }
    </script>
  </body>
</html>
